<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Font configuration for certificate rendering.

  Certificates are rasterised with sharp, whose SVG renderer (librsvg) resolves
  fonts through fontconfig and ignores @font-face inside the SVG. Exposing only
  the fonts bundled here — rather than whatever the host OS happens to have —
  is what makes a certificate render identically on a developer's machine and
  on the server.

  prefix="relative" resolves against this file's own directory, so the same
  committed config works from any checkout path and inside the container.

  This file has no effect unless FONTCONFIG_FILE points at it *before the Node
  process starts*; fontconfig reads its environment during library load, so
  assigning process.env at runtime is too late. The Dockerfile sets it; for
  local development see utils/fontBootstrap.js, which logs the value to use.
-->
<fontconfig>
  <dir prefix="relative">../fonts</dir>
  <cachedir prefix="relative">cache</cachedir>
</fontconfig>
